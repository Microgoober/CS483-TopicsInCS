<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard - SMcC</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="title" id="title">
            The Weather Cast:
        </div>
        <div class="search-area">
            <input id="searchBox" placeholder="Enter city, country code" type="text">
            <div id="timestamp"></div>
        </div>
    </header>

    <main class="main-grid">
        <section class="weather-section">
            <div class="widget">
                <h3>Temperature</h3>
                <p id="temp"></p>
            </div>
            <div class="widget">
                <h3>Humidity</h3>
                <p id="humidity"></p>
            </div>
            <div class="widget">
                <h3>Wind</h3>
                <p id="wind"></p>
            </div>
            <div class="widget">
                <h3>Sunrise</h3>
                <p id="sunrise"></p>
            </div>
            <div class="widget">
                <h3>Sunset</h3>
                <p id="sunset"></p>
            </div>
            <div class="widget">
                <h3>Cloudiness</h3>
                <p id="clouds"></p>
            </div>
        </section>

        <section class="forecast-section">
            <div id="forecastContainer" class="forecast-container"></div>
        </section>
    </main>
</body>
</html>
